name: stillspace
description: A mental wellness app for everyday calm.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
 

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false 
  image_path: "assets/836FDC1F-C202-476D-AF76-12FF019E0609.png"
flutter_native_splash:
  color: "#F2EDE2"
  color_dark: "#26352D"
  android: true
  ios: false
  fullscreen: true
